<h1>IndexedDB Prototype</h1>

<h2>Employees</h2>

<div>

  <input type="text" placeholder="Name" [(ngModel)]="employee.name">

  <input type="email" placeholder="Email" [(ngModel)]="employee.email">

  <input type="text" placeholder="Department" [(ngModel)]="employee.department">

  <button (click)="saveEmployee()">
    {{ editingEmployeeId ? 'Update' : 'Add' }}
  </button>

  <button *ngIf="editingEmployeeId" (click)="clearEmployeeForm()">
    Cancel
  </button>

</div>

<hr>

<table border="1">

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Department</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let employee of employees">

      <td>{{ employee.id }}</td>

      <td>{{ employee.name }}</td>

      <td>{{ employee.email }}</td>

      <td>{{ employee.department }}</td>

      <td>

        <button (click)="editEmployee(employee)">
          Edit
        </button>

        <button (click)="deleteEmployee(employee.id!)">
          Delete
        </button>

      </td>

    </tr>

  </tbody>

</table>



<hr>

<h2>Products</h2>

<div>

  <input type="text" placeholder="Product name" [(ngModel)]="product.name">

  <input type="number" placeholder="Price" [(ngModel)]="product.price">

  <input type="number" placeholder="Quantity" [(ngModel)]="product.quantity">

  <button (click)="saveProduct()">
    {{ editingProductId ? 'Update' : 'Add' }}
  </button>

  <button *ngIf="editingProductId" (click)="clearProductForm()">
    Cancel
  </button>

</div>

<hr>

<table border="1">

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let product of products">

      <td>{{ product.id }}</td>

      <td>{{ product.name }}</td>

      <td>{{ product.price }}</td>

      <td>{{ product.quantity }}</td>

      <td>

        <button (click)="editProduct(product)">
          Edit
        </button>

        <button (click)="deleteProduct(product.id!)">
          Delete
        </button>

      </td>

    </tr>

  </tbody>

</table>

<h1>IndexedDB Prototype</h1>

<button (click)="exportData()">
  Export Data
</button>
